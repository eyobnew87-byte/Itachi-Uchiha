package com.itachi
import android.animation.ValueAnimator
import android.content.Context
import android.graphics.*
import android.util.AttributeSet
import android.view.View
import android.view.animation.LinearInterpolator
import kotlin.math.*
class SharinganView @JvmOverloads constructor(context: Context, attrs: AttributeSet? = null) : View(context, attrs) {
  private var rot = 0f; private var pulse = 1f; private var glow = 180
  private var cx = 0f; private var cy = 0f; private var r = 0f
  private val bp = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#0A0A0A"); style = Paint.Style.FILL }
  private val ep = Paint(Paint.ANTI_ALIAS_FLAG)
  private val gp = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#FF000066") }
  private val pp = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#6B0000") }
  private val rp = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#0A0A0A"); style = Paint.Style.STROKE }
  init { setLayerType(LAYER_TYPE_SOFTWARE, null) }
  override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
    cx = w/2f; cy = h/2f; r = minOf(w,h)/2f*0.9f
    ep.shader = RadialGradient(cx,cy,r,
      intArrayOf(Color.parseColor("#FF1111"),Color.parseColor("#CC0000"),Color.parseColor("#8B0000"),Color.parseColor("#2A0000")),
      floatArrayOf(0f,0.4f,0.75f,1f), Shader.TileMode.CLAMP)
    gp.maskFilter = BlurMaskFilter(r*0.15f, BlurMaskFilter.Blur.OUTER)
    rp.strokeWidth = r*0.05f
  }
  override fun onDraw(c: Canvas) {
    if(r==0f) return
    c.save(); c.scale(pulse,pulse,cx,cy)
    c.drawCircle(cx,cy,r*1.05f,gp.apply{alpha=glow})
    c.drawCircle(cx,cy,r,ep)
    val vp = Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.parseColor("#1A0000");style=Paint.Style.STROKE;strokeWidth=1.5f}
    for(i in 0..39){val a=Math.toRadians(i*9.0);c.drawLine(cx+(r*0.35f*cos(a)).toFloat(),cy+(r*0.35f*sin(a)).toFloat(),cx+(r*0.88f*cos(a)).toFloat(),cy+(r*0.88f*sin(a)).toFloat(),vp)}
    c.drawCircle(cx,cy,r, Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.parseColor("#0A0A0A");style=Paint.Style.STROKE;strokeWidth=r*0.06f;maskFilter=BlurMaskFilter(4f,BlurMaskFilter.Blur.NORMAL)})
    c.drawCircle(cx,cy,r*0.62f,rp)
    c.save(); c.rotate(rot,cx,cy)
    listOf(270f,30f,150f).forEach{a->
      val rad=Math.toRadians(a.toDouble())
      val tx=cx+(r*0.42f*cos(rad)).toFloat(); val ty=cy+(r*0.42f*sin(rad)).toFloat()
      c.drawCircle(tx,ty,r*0.09f,bp)
      val p=Path(); p.moveTo(tx,ty)
      p.cubicTo(cx+(r*0.5f*cos(rad+0.8)).toFloat(),cy+(r*0.5f*sin(rad+0.8)).toFloat(),cx+(r*0.3f*cos(rad+1.4)).toFloat(),cy+(r*0.3f*sin(rad+1.4)).toFloat(),cx+(r*0.55f*cos(rad+2.1)).toFloat(),cy+(r*0.55f*sin(rad+2.1)).toFloat())
      p.quadTo(cx+(r*0.2f*cos(rad+1.0)).toFloat(),cy+(r*0.2f*sin(rad+1.0)).toFloat(),tx,ty)
      p.close(); c.drawPath(p,bp)}
    c.restore()
    c.drawCircle(cx,cy,r*0.16f,pp)
    val hp = Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.parseColor("#AA3333")}
    c.drawCircle(cx-r*0.04f,cy-r*0.04f,r*0.06f,hp)
    c.restore()
  }
  fun startAnimation() {
    ValueAnimator.ofFloat(0f,360f).apply{duration=6000;repeatCount=ValueAnimator.INFINITE;interpolator=LinearInterpolator();addUpdateListener{rot=it.animatedValue as Float;invalidate()};start()}
    ValueAnimator.ofFloat(1f,1.04f,1f).apply{duration=2000;repeatCount=ValueAnimator.INFINITE;addUpdateListener{pulse=it.animatedValue as Float;invalidate()};start()}
    ValueAnimator.ofInt(120,220,120).apply{duration=2500;repeatCount=ValueAnimator.INFINITE;addUpdateListener{glow=it.animatedValue as Int;invalidate()};start()}
  }
  fun setThinking(on: Boolean) { /* speed up rotation when thinking */ }
}
