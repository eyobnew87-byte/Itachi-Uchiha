name: Build ITACHI APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'
      - uses: android-actions/setup-android@v3
      - name: Build Full ITACHI APK
        run: |
          mkdir -p app/src/main/java/com/itachi
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

          cat > settings.gradle << 'SEOF'
          rootProject.name = "ITACHI"
          include ':app'
          SEOF

          cat > build.gradle << 'BEOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          BEOF

          cat > gradle.properties << 'GEOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          GEOF

          cat > app/build.gradle << 'AEOF'
          plugins {
            id 'com.android.application'
            id 'kotlin-android'
          }
          android {
            namespace 'com.itachi'
            compileSdk 34
            defaultConfig {
              applicationId 'com.itachi'
              minSdk 26
              targetSdk 34
              versionCode 2
              versionName '2.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { viewBinding true }
          }
          repositories {
            google()
            mavenCentral()
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          AEOF

          cat > app/src/main/AndroidManifest.xml << 'MEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <uses-permission android:name="android.permission.CALL_PHONE"/>
            <uses-permission android:name="android.permission.READ_CONTACTS"/>
            <uses-permission android:name="android.permission.SEND_SMS"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application
              android:label="ITACHI"
              android:icon="@mipmap/ic_launcher"
              android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar"
              android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true"
                android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".ItachiService"
                android:exported="false"
                android:foregroundServiceType="microphone"/>
            </application>
          </manifest>
          MEOF

          cat > app/src/main/java/com/itachi/SharinganView.kt << 'KEOF'
          package com.itachi
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.*
          class SharinganView @JvmOverloads constructor(
            context: Context, attrs: AttributeSet? = null
          ) : View(context, attrs) {
            private var rotation = 0f
            private var pulse = 1f
            private var glow = 180
            private var cx = 0f; private var cy = 0f; private var r = 0f
            private val eyePaint = Paint(Paint.ANTI_ALIAS_FLAG)
            private val blackPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
              color = Color.parseColor("#0A0A0A"); style = Paint.Style.FILL
            }
            private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
              color = Color.parseColor("#0A0A0A"); style = Paint.Style.STROKE
            }
            private val glowPaint = Paint(Paint.ANTI_ALIAS_FLAG)
            private val pupilPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
              color = Color.parseColor("#6B0000"); style = Paint.Style.FILL
            }
            init { setLayerType(LAYER_TYPE_SOFTWARE, null) }
            override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
              cx = w/2f; cy = h/2f; r = minOf(w,h)/2f * 0.9f
              eyePaint.shader = RadialGradient(cx,cy,r,
                intArrayOf(Color.parseColor("#FF1111"),Color.parseColor("#CC0000"),
                  Color.parseColor("#8B0000"),Color.parseColor("#2A0000")),
                floatArrayOf(0f,0.4f,0.75f,1f), Shader.TileMode.CLAMP)
              ringPaint.strokeWidth = r*0.05f
              glowPaint.apply {
                color = Color.parseColor("#FF000066")
                maskFilter = BlurMaskFilter(r*0.15f, BlurMaskFilter.Blur.OUTER)
              }
            }
            override fun onDraw(c: Canvas) {
              if(r==0f) return
              c.save(); c.scale(pulse,pulse,cx,cy)
              c.drawCircle(cx,cy,r*1.05f, glowPaint.apply{alpha=glow})
              c.drawCircle(cx,cy,r,eyePaint)
              drawVeins(c)
              c.drawCircle(cx,cy,r, Paint(Paint.ANTI_ALIAS_FLAG).apply{
                color=Color.parseColor("#0A0A0A");style=Paint.Style.STROKE
                strokeWidth=r*0.06f
                maskFilter=BlurMaskFilter(4f,BlurMaskFilter.Blur.NORMAL)})
              c.drawCircle(cx,cy,r*0.62f,ringPaint)
              c.save(); c.rotate(rotation,cx,cy); drawTomoe(c); c.restore()
              c.drawCircle(cx,cy,r*0.16f,pupilPaint)
              c.restore()
            }
            private fun drawVeins(c: Canvas) {
              val p = Paint(Paint.ANTI_ALIAS_FLAG).apply{
                color=Color.parseColor("#1A0000");style=Paint.Style.STROKE;strokeWidth=1.5f}
              for(i in 0..39){
                val a = Math.toRadians(i*9.0)
                c.drawLine(cx+(r*0.35f*cos(a)).toFloat(),cy+(r*0.35f*sin(a)).toFloat(),
                  cx+(r*0.88f*cos(a)).toFloat(),cy+(r*0.88f*sin(a)).toFloat(),p)}}
            private fun drawTomoe(c: Canvas) {
              listOf(270f,30f,150f).forEach{a ->
                val rad = Math.toRadians(a.toDouble())
                val tx = cx+(r*0.42f*cos(rad)).toFloat()
                val ty = cy+(r*0.42f*sin(rad)).toFloat()
                c.drawCircle(tx,ty,r*0.09f,blackPaint)
                val path = Path()
                path.moveTo(tx,ty)
                path.cubicTo(
                  cx+(r*0.5f*cos(rad+0.8)).toFloat(),cy+(r*0.5f*sin(rad+0.8)).toFloat(),
                  cx+(r*0.3f*cos(rad+1.4)).toFloat(),cy+(r*0.3f*sin(rad+1.4)).toFloat(),
                  cx+(r*0.55f*cos(rad+2.1)).toFloat(),cy+(r*0.55f*sin(rad+2.1)).toFloat())
                path.quadTo(cx+(r*0.2f*cos(rad+1.0)).toFloat(),
                  cy+(r*0.2f*sin(rad+1.0)).toFloat(),tx,ty)
                path.close(); c.drawPath(path,blackPaint)}}
            fun startAnimation() {
              ValueAnimator.ofFloat(0f,360f).apply{
                duration=6000;repeatCount=ValueAnimator.INFINITE
                interpolator=LinearInterpolator()
                addUpdateListener{rotation=it.animatedValue as Float;invalidate()}
                start()}
              ValueAnimator.ofFloat(1f,1.04f,1f).apply{
                duration=2000;repeatCount=ValueAnimator.INFINITE
                addUpdateListener{pulse=it.animatedValue as Float;invalidate()}
                start()}
              ValueAnimator.ofInt(120,220,120).apply{
                duration=2500;repeatCount=ValueAnimator.INFINITE
                addUpdateListener{glow=it.animatedValue as Int;invalidate()}
                start()}}
          }
          KEOF

          cat > app/src/main/java/com/itachi/ItachiService.kt << 'KEOF'
          package com.itachi
          import android.app.*
          import android.content.Intent
          import android.os.IBinder
          import android.speech.tts.TextToSpeech
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.RecognitionListener
          import android.os.Bundle
          import android.util.Log
          import kotlinx.coroutines.*
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.*
          class ItachiService : Service(), TextToSpeech.OnInitListener {
            companion object {
              var isRunning = false
              var isAwake = false
              var onResponse: ((String) -> Unit)? = null
              var onListening: ((Boolean) -> Unit)? = null
              const val WAKE = "itachi"
              const val SLEEP = "uchiha"
            }
            private var tts: TextToSpeech? = null
            private var recognizer: SpeechRecognizer? = null
            private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
            private val client = OkHttpClient()
            private var apiKey = ""
            override fun onBind(i: Intent?): IBinder? = null
            override fun onCreate() {
              super.onCreate()
              isRunning = true
              startForeground(1, buildNotification())
              tts = TextToSpeech(this, this)
            }
            override fun onInit(status: Int) {
              if(status == TextToSpeech.SUCCESS) {
                tts?.language = Locale.US
                tts?.setSpeechRate(0.95f)
                tts?.setPitch(0.85f)
                startListening()
              }
            }
            override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
              apiKey = i?.getStringExtra("api_key") ?: ""
              return START_STICKY
            }
            private fun startListening() {
              recognizer = SpeechRecognizer.createSpeechRecognizer(this)
              recognizer?.setRecognitionListener(object: RecognitionListener {
                override fun onResults(b: Bundle?) {
                  val r = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                  val text = r?.firstOrNull()?.lowercase() ?: ""
                  when {
                    !isAwake && text.contains(WAKE) -> {
                      isAwake = true
                      speak("I am here. How may I assist you?")
                      onListening?.invoke(true)
                    }
                    isAwake && text.contains(SLEEP) -> {
                      isAwake = false
                      speak("Goodbye. Standing by.")
                      onListening?.invoke(false)
                    }
                    isAwake -> processCommand(text)
                  }
                  restartListening()
                }
                override fun onError(e: Int) { restartListening() }
                override fun onReadyForSpeech(p: Bundle?) {}
                override fun onBeginningOfSpeech() {}
                override fun onRmsChanged(r: Float) {}
                override fun onBufferReceived(b: ByteArray?) {}
                override fun onEndOfSpeech() {}
                override fun onPartialResults(p: Bundle?) {}
                override fun onEvent(t: Int, p: Bundle?) {}
              })
              val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                  RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault())
              }
              recognizer?.startListening(intent)
            }
            private fun restartListening() {
              scope.launch { delay(500); startListening() }
            }
            private fun processCommand(text: String) {
              scope.launch(Dispatchers.IO) {
                try {
                  val messages = JSONArray().apply {
                    put(JSONObject().apply {
                      put("role","system")
                      put("content","You are ITACHI, an AI assistant like JARVIS. Be concise, calm, and helpful. Keep responses under 2 sentences.")
                    })
                    put(JSONObject().apply { put("role","user"); put("content",text) })
                  }
                  val body = JSONObject().apply {
                    put("model","gpt-4o-mini")
                    put("messages",messages)
                    put("max_tokens",150)
                  }.toString()
                  val req = Request.Builder()
                    .url("https://api.openai.com/v1/chat/completions")
                    .addHeader("Authorization","Bearer $apiKey")
                    .addHeader("Content-Type","application/json")
                    .post(body.toRequestBody("application/json".toMediaType()))
                    .build()
                  val resp = client.newCall(req).execute()
                  val json = JSONObject(resp.body?.string() ?: "")
                  val reply = json.getJSONArray("choices")
                    .getJSONObject(0).getJSONObject("message")
                    .getString("content").trim()
                  withContext(Dispatchers.Main) {
                    onResponse?.invoke(reply)
                    speak(reply)
                  }
                } catch(e: Exception) {
                  withContext(Dispatchers.Main) {
                    speak("I encountered an error. Please check your connection.")
                  }
                }
              }
            }
            fun speak(text: String) {
              val p = Bundle().apply {
                putString(TextToSpeech.Engine.KEY_PARAM_UTTERANCE_ID, UUID.randomUUID().toString())
              }
              tts?.speak(text, TextToSpeech.QUEUE_FLUSH, p, p.getString(TextToSpeech.Engine.KEY_PARAM_UTTERANCE_ID))
            }
            private fun buildNotification(): Notification {
              val ch = NotificationChannel("itachi","ITACHI",NotificationManager.IMPORTANCE_LOW)
              getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
              return Notification.Builder(this,"itachi")
                .setContentTitle("ITACHI Active")
                .setContentText("Say 'ITACHI' to activate")
                .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                .build()
            }
            override fun onDestroy() {
              super.onDestroy()
              isRunning = false
              tts?.shutdown()
              recognizer?.destroy()
              scope.cancel()
            }
          }
          KEOF

          cat > app/src/main/java/com/itachi/MainActivity.kt << 'KEOF'
          package com.itachi
          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          class MainActivity : AppCompatActivity() {
            private lateinit var sharingan: SharinganView
            private lateinit var tvStatus: TextView
            private lateinit var tvResponse: TextView
            private lateinit var etApiKey: EditText
            private lateinit var btnActivate: Button
            override fun onCreate(s: Bundle?) {
              super.onCreate(s)
              setContentView(R.layout.activity_main)
              sharingan = findViewById(R.id.sharingan)
              tvStatus = findViewById(R.id.tv_status)
              tvResponse = findViewById(R.id.tv_response)
              etApiKey = findViewById(R.id.et_api_key)
              btnActivate = findViewById(R.id.btn_activate)
              sharingan.startAnimation()
              ItachiService.onResponse = { runOnUiThread {
                tvResponse.text = it
                tvStatus.text = "⚡ ONLINE"
              }}
              ItachiService.onListening = { awake -> runOnUiThread {
                if(awake) {
                  tvStatus.text = "🔴 LISTENING..."
                  tvResponse.text = ""
                } else {
                  tvStatus.text = "● STANDBY"
                }
              }}
              btnActivate.setOnClickListener {
                if(ItachiService.isRunning) {
                  stopService(Intent(this, ItachiService::class.java))
                  btnActivate.text = "ACTIVATE ITACHI"
                  tvStatus.text = "● OFFLINE"
                } else {
                  requestPermissionsAndStart()
                }
              }
              checkOverlayPermission()
            }
            private fun requestPermissionsAndStart() {
              val perms = arrayOf(Manifest.permission.RECORD_AUDIO)
              if(perms.all{ContextCompat.checkSelfPermission(this,it)==PackageManager.PERMISSION_GRANTED}) {
                startItachi()
              } else {
                ActivityCompat.requestPermissions(this, perms, 1)
              }
            }
            private fun startItachi() {
              val key = etApiKey.text.toString().trim()
              val i = Intent(this, ItachiService::class.java).apply {
                putExtra("api_key", key)
              }
              startForegroundService(i)
              btnActivate.text = "DEACTIVATE ITACHI"
              tvStatus.text = "⚡ ONLINE — Say 'ITACHI'"
            }
            private fun checkOverlayPermission() {
              if(!Settings.canDrawOverlays(this)) {
                startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                  Uri.parse("package:$packageName")))
              }
            }
            override fun onRequestPermissionsResult(req: Int, perms: Array<String>, results: IntArray) {
              super.onRequestPermissionsResult(req, perms, results)
              if(results.isNotEmpty() && results[0] == PackageManager.PERMISSION_GRANTED) startItachi()
            }
          }
          KEOF

          cat > app/src/main/res/layout/activity_main.xml << 'LEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
           
