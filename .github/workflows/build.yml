        run: |
          mkdir -p app/src/main/java/com/itachi
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/drawable

          printf 'rootProject.name = "ITACHI"\ninclude ":app"\n' > settings.gradle

          printf 'buildscript {\n  repositories { google(); mavenCentral() }\n  dependencies {\n    classpath "com.android.tools.build:gradle:8.2.2"\n    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"\n  }\n}\n' > build.gradle

