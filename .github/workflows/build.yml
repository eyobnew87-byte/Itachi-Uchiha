package com.itachi
import android.app.*
import android.content.Intent
import android.os.Build
import android.os.IBinder
import android.speech.tts.TextToSpeech
import android.speech.RecognizerIntent
import android.speech.SpeechRecognizer
import android.speech.RecognitionListener
import android.os.Bundle
import android.util.Log
import android.util.Base64
import kotlinx.coroutines.*
import okhttp3.*
import okhttp3.MediaType.Companion.toMediaType
import okhttp3.RequestBody.Companion.toRequestBody
import org.json.JSONArray
import org.json.JSONObject
import java.util.*
class ItachiService : Service(), TextToSpeech.OnInitListener {
  companion object {
    var isRunning = false
    var isAwake = false
    var apiKey = ""
    var onResponse: ((String) -> Unit)? = null
    var onListening: ((Boolean) -> Unit)? = null
    var onThinking: ((Boolean) -> Unit)? = null
    const val WAKE = "itachi"
    const val SLEEP = "uchiha"
  }
  private var tts: TextToSpeech? = null
  private var recognizer: SpeechRecognizer? = null
  private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
  private val client = OkHttpClient.Builder()
    .connectTimeout(30, java.util.concurrent.TimeUnit.SECONDS)
    .readTimeout(60, java.util.concurrent.TimeUnit.SECONDS)
    .build()
  private val history = mutableListOf<Pair<String,String>>()
  override fun onBind(i: Intent?): IBinder? = null
  override fun onCreate() {
    super.onCreate()
    isRunning = true
    val ch = NotificationChannel("itachi","ITACHI",NotificationManager.IMPORTANCE_LOW)
    getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
    val notif = Notification.Builder(this,"itachi")
      .setContentTitle("ITACHI â€” Standing By")
      .setContentText("Say 'ITACHI' to activate")
      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
      .build()
    startForeground(1, notif)
    tts = TextToSpeech(this, this)
  }
  override fun onInit(status: Int) {
    if(status == TextToSpeech.SUCCESS) {
      tts?.language = Locale.US
      tts?.setSpeechRate(0.95f)
      tts?.setPitch(0.85f)
      speak("ITACHI initialized. Standing by.")
      startListening()
    }
  }
  override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
    apiKey = i?.getStringExtra("api_key") ?: apiKey
    return START_STICKY
  }
  private fun startListening() {
    if(!isRunning) return
    recognizer?.destroy()
    recognizer = SpeechRecognizer.createSpeechRecognizer(this)
    recognizer?.setRecognitionListener(object: RecognitionListener {
      override fun onResults(b: Bundle?) {
        val results = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
        val text = results?.firstOrNull()?.lowercase()?.trim() ?: ""
        Log.d("ITACHI","Heard: $text")
        when {
          !isAwake && text.contains(WAKE) -> {
            isAwake = true
            onListening?.invoke(true)
            speak("I am here. How may I assist you, sir?")
          }
          isAwake && text.contains(SLEEP) -> {
            isAwake = false
            onListening?.invoke(false)
            speak("Goodbye. Standing by.")
          }
          isAwake && text.isNotBlank() -> processCommand(text)
        }
        scope.launch { delay(300); startListening() }
      }
      override fun onError(e: Int) { scope.launch { delay(500); startListening() } }
      override fun onReadyForSpeech(p: Bundle?) {}
      override fun onBeginningOfSpeech() {}
      override fun onRmsChanged(r: Float) {}
      override fun onBufferReceived(b: ByteArray?) {}
      override fun onEndOfSpeech() {}
      override fun onPartialResults(p: Bundle?) {}
      override fun onEvent(t: Int, p: Bundle?) {}
    })
    val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
      putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault())
      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
    }
    try { recognizer?.startListening(intent) } catch(e: Exception) { Log.e("ITACHI","Listen error: ${e.message}") }
  }
  private fun processCommand(text: String) {
    scope.launch(Dispatchers.IO) {
      withContext(Dispatchers.Main) { onThinking?.invoke(true) }
      try {
        val systemPrompt = """You are ITACHI, an elite AI assistant inspired by both JARVIS from Iron Man and Itachi Uchiha. 
You are calm, precise, powerful and deeply intelligent. Address the user as "sir" unless told otherwise.
Keep responses under 2 sentences unless detail is needed. Be direct and solution-focused.
You have access to: voice control, phone functions, camera vision, web search knowledge, and AI reasoning."""
        val messages = JSONArray()
        messages.put(JSONObject().apply { put("role","system"); put("content",systemPrompt) })
        history.takeLast(6).forEach { (role,content) ->
          messages.put(JSONObject().apply { put("role",role); put("content",content) })
        }
        messages.put(JSONObject().apply { put("role","user"); put("content",text) })
        val body = JSONObject().apply {
          put("model","gpt-4o-mini")
          put("messages",messages)
          put("max_tokens",200)
          put("temperature",0.7)
        }.toString()
        val req = Request.Builder()
          .url("https://api.openai.com/v1/chat/completions")
          .addHeader("Authorization","Bearer $apiKey")
          .addHeader("Content-Type","application/json")
          .post(body.toRequestBody("application/json".toMediaType()))
          .build()
        val resp = client.newCall(req).execute()
        val json = JSONObject(resp.body?.string() ?: throw Exception("Empty response"))
        val reply = json.getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
        history.add(Pair("user",text))
        history.add(Pair("assistant",reply))
        if(history.size > 20) { history.removeAt(0); history.removeAt(0) }
        withContext(Dispatchers.Main) {
          onThinking?.invoke(false)
          onResponse?.invoke(reply)
          speak(reply)
        }
      } catch(e: Exception) {
        val err = when {
          apiKey.isBlank() -> "Please enter your OpenAI API key in settings."
          e.message?.contains("401") == true -> "Invalid API key. Please check your settings."
          e.message?.contains("network") == true -> "Network error. Please check your connection."
          else -> "I encountered an error. Please try again."
        }
        withContext(Dispatchers.Main) {
          onThinking?.invoke(false)
          onResponse?.invoke(err)
          speak(err)
        }
      }
    }
  }
  fun analyzeWithCamera(imageBase64: String, prompt: String) {
    scope.launch(Dispatchers.IO) {
      withContext(Dispatchers.Main) { onThinking?.invoke(true) }
      try {
        val messages = JSONArray()
        messages.put(JSONObject().apply {
          put("role","system")
          put("content","You are ITACHI. Analyze what you see through the camera and describe it concisely.")
        })
        val userContent = JSONArray()
        userContent.put(JSONObject().apply { put("type","text"); put("text",prompt) })
        userContent.put(JSONObject().apply {
          put("type","image_url")
          put("image_url", JSONObject().apply { put("url","data:image/jpeg;base64,$imageBase64") })
        })
        messages.put(JSONObject().apply { put("role","user"); put("content",userContent) })
        val body = JSONObject().apply {
          put("model","gpt-4o-mini")
          put("messages",messages)
          put("max_tokens",300)
        }.toString()
        val req = Request.Builder()
          .url("https://api.openai.com/v1/chat/completions")
          .addHeader("Authorization","Bearer $apiKey")
          .addHeader("Content-Type","application/json")
          .post(body.toRequestBody("application/json".toMediaType()))
          .build()
        val resp = client.newCall(req).execute()
        val json = JSONObject(resp.body?.string() ?: "")
        val reply = json.getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
        withContext(Dispatchers.Main) {
          onThinking?.invoke(false)
          onResponse?.invoke(reply)
          speak(reply)
        }
      } catch(e: Exception) {
        withContext(Dispatchers.Main) {
          onThinking?.invoke(false)
          speak("Camera analysis failed. ${e.message}")
        }
      }
    }
  }
  fun speak(text: String) {
    val id = UUID.randomUUID().toString()
    val p = Bundle().apply { putString(TextToSpeech.Engine.KEY_PARAM_UTTERANCE_ID, id) }
    tts?.speak(text, TextToSpeech.QUEUE_FLUSH, p, id)
  }
  override fun onDestroy() {
    super.onDestroy()
    isRunning = false
    isAwake = false
    recognizer?.destroy()
    tts?.shutdown()
    scope.cancel()
  }
}
